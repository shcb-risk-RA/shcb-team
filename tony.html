<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Chan - 風險分析團隊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #fff; }
        .header { text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.05); }
        .bank-logo { font-size: 36px; margin-bottom: 10px; }
        .bank-name { font-size: 14px; color: rgba(255,255,255,0.5); letter-spacing: 2px; }
        .profile { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #e94560, #0f3460); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; font-weight: 700; }
        .name { font-size: 28px; text-align: center; margin-bottom: 5px; }
        .role { text-align: center; color: #e94560; font-size: 14px; letter-spacing: 2px; margin-bottom: 30px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; margin-bottom: 20px; }
        .card h3 { font-size: 14px; color: rgba(255,255,255,0.5); letter-spacing: 2px; margin-bottom: 15px; }
        .card p { font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.8); }
        .skills { display: flex; flex-wrap: wrap; gap: 10px; }
        .skill { background: rgba(233, 69, 96, 0.2); border: 1px solid rgba(233, 69, 96, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: rgba(255,255,255,0.8); }
        .back { display: inline-block; margin: 20px 20px; color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; }
        .back:hover { color: #e94560; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回團隊首頁</a>
    <div class="header">
        <div class="bank-logo">🏦</div>
        <div class="bank-name">上海商業銀行 · 風險分析團隊</div>
    </div>
    <div class="profile">
        <div class="avatar">TC</div>
        <h1 class="name">Tony Chan</h1>
        <p class="role">團隊領導 · Team Leader</p>
        
        <div class="card">
            <h3>職責範圍</h3>
            <p>負責整體風險策略規劃與團隊管理，制定年度風險管理目標，協調各專業領域之風險評估工作，確保銀行風險管理符合監管要求及內部政策。</p>
        </div>
        
        <div class="card">
            <h3>專業領域</h3>
            <div class="skills">
                <span class="skill">風險策略</span>
                <span class="skill">團隊管理</span>
                <span class="skill">監管合規</span>
                <span class="skill">風險框架</span>
                <span class="skill">決策分析</span>
            </div>
        </div>
        
        <div class="card">
            <h3>工作成就</h3>
            <p>領導團隊完成多年期風險評估項目，建立先進風險評分模型，提升銀行風險識別能力，推動数字化转型項目。</p>
        </div>
    </div>
</body>
</html>
